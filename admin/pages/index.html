<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>頁面管理 | CTDF Admin Demo</title><meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="/assets/demo.css"></head><body class="admin-page" data-admin-path="admin/pages"><header class="admin-topbar"><a class="admin-brand" href="/admin/"><img src="/assets/ctdf-logo.png" alt="CTDF"><span><b>CTDF 後台管理</b><small>操作 Demo</small></span></a><div><span class="demo-badge">DEMO</span><a class="view-site" href="/">查看前台</a></div></header><div class="admin-shell"><aside class="admin-sidebar" aria-label="後台功能">
    <div class="admin-sidebar-title">內容管理</div>
    <nav><a href="/admin/">總覽</a><a href="/admin/news/">公告</a><a href="/admin/events/">賽事</a><a href="/admin/media/">影音</a><a href="/admin/downloads/">文件</a><a href="/admin/pages/" class="active" aria-current="page">頁面</a><a href="/admin/settings/site/">網站設定</a><a href="/admin/logs/">操作紀錄</a></nav>
    <div class="admin-user"><span>秘書處管理員</span><small>Demo 權限</small></div>
  </aside><main class="admin-main"><div class="admin-page-head"><div><p class="admin-kicker">內容管理</p><h1>頁面管理</h1><p>修改固定頁面的文字與圖片，版型仍由網站統一處理。</p></div><button class="admin-button" type="button" data-new>＋ 新增頁面</button></div>
    <section class="admin-panel">
      <div class="admin-toolbar"><label class="admin-search"><span class="sr-only">搜尋</span><input type="search" placeholder="搜尋標題或分類" data-search></label><label><span class="sr-only">狀態篩選</span><select data-status-filter><option value="">全部狀態</option><option value="draft">草稿</option><option value="review">待審核</option><option value="scheduled">已排程</option><option value="published">已發布</option></select></label><span class="admin-count" data-count>4 筆內容</span></div>
      <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>標題</th><th>分類</th><th>日期</th><th>狀態</th><th>最後更新</th><th><span class="sr-only">操作</span></th></tr></thead><tbody data-content-rows><tr data-row data-status="published"><td><b>關於總會</b></td><td>關於本會</td><td>固定頁面</td><td><span class="status-badge status-published" data-status-label>已發布</span></td><td>8月30日</td><td><button class="table-action" type="button" data-edit data-title="關於總會" data-category="關於本會" data-date="固定頁面" data-status="published">編輯</button></td></tr><tr data-row data-status="published"><td><b>組織架構</b></td><td>關於本會</td><td>固定頁面</td><td><span class="status-badge status-published" data-status-label>已發布</span></td><td>8月28日</td><td><button class="table-action" type="button" data-edit data-title="組織架構" data-category="關於本會" data-date="固定頁面" data-status="published">編輯</button></td></tr><tr data-row data-status="review"><td><b>聯絡我們</b></td><td>關於本會</td><td>固定頁面</td><td><span class="status-badge status-review" data-status-label>待審核</span></td><td>8月27日</td><td><button class="table-action" type="button" data-edit data-title="聯絡我們" data-category="關於本會" data-date="固定頁面" data-status="review">編輯</button></td></tr><tr data-row data-status="draft"><td><b>隱私權政策</b></td><td>網站政策</td><td>固定頁面</td><td><span class="status-badge status-draft" data-status-label>草稿</span></td><td>8月22日</td><td><button class="table-action" type="button" data-edit data-title="隱私權政策" data-category="網站政策" data-date="固定頁面" data-status="draft">編輯</button></td></tr></tbody></table></div>
      <div class="admin-empty" data-empty hidden>找不到符合條件的內容。</div>
    </section><dialog class="admin-dialog" data-editor-dialog>
    <form class="admin-editor" data-editor-form>
      <div class="admin-dialog-head"><div><small>內容編輯</small><h2 data-editor-heading>新增頁面</h2></div><button class="icon-button" type="button" data-close-editor aria-label="關閉">×</button></div>
      <div class="admin-form-grid"><label class="admin-field"><span>頁面標題</span><input name="title" type="text" placeholder="頁面標題" required></label><label class="admin-field"><span>頁面位置</span><select name="category" required><option value="">請選擇</option><option>關於本會</option><option>網站政策</option><option>聯絡資訊</option></select></label><label class="admin-field admin-field-wide"><span>頁面摘要</span><textarea name="summary" rows="4" placeholder="顯示於頁首的簡短說明"></textarea></label><label class="admin-field admin-field-wide"><span>頁面內容</span><textarea name="body" rows="8" placeholder="網站會自動套用固定版型"></textarea></label><label class="admin-field admin-field-wide"><span>頁面圖片</span><input name="cover" type="file" accept="image/*"><small>Demo 僅顯示選取的檔名，不會實際上傳。</small></label>
        <label class="admin-field"><span>內容狀態</span><select name="status"><option value="draft">草稿</option><option value="review">待審核</option><option value="scheduled">已排程</option><option value="published">已發布</option></select></label>
      </div>
      <div class="admin-form-actions"><button class="admin-button secondary" type="button" data-preview>預覽</button><span class="action-spacer"></span><button class="admin-button secondary" type="button" data-save-draft>儲存草稿</button><button class="admin-button" type="button" data-submit-review>送交審核</button><button class="admin-button publish" type="submit">發布</button></div>
    </form>
  </dialog>
  <dialog class="admin-dialog preview-dialog" data-preview-dialog>
    <div class="admin-dialog-head"><div><small>前台版型預覽</small><h2 data-preview-title>內容預覽</h2></div><button class="icon-button" type="button" data-close-preview aria-label="關閉">×</button></div>
    <div class="preview-surface"><span class="tag" data-preview-category>分類</span><h1 data-preview-heading>尚未輸入標題</h1><p data-preview-summary>填寫內容後即可在此確認前台呈現方式。</p><div class="preview-body" data-preview-body></div></div>
  </dialog></main></div><div class="admin-toast" role="status" aria-live="polite" data-toast></div><script src="/assets/admin-demo.js"></script></body></html>
