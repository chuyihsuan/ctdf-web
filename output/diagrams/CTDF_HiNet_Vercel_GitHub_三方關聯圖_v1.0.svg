<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CTDF 網站服務架構：HiNet、GitHub 與 Vercel 三方關聯圖</title>
  <desc id="desc">GitHub 儲存網站程式與版本，Vercel 自動取得程式並部署網站，HiNet 管理 ctdf.org.tw 的 DNS 並將網域指向 Vercel。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16345b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#2f6fb0"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#178760"/>
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 Z" fill="#d83a45"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#f6f9fd"/>
  <rect x="0" y="0" width="1920" height="12" fill="#d83a45"/>
  <circle cx="1725" cy="112" r="150" fill="#eaf3ff"/>
  <circle cx="1820" cy="205" r="72" fill="#e7f7f0"/>

  <text x="110" y="92" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="42" font-weight="700" fill="#142033">CTDF 網站服務架構</text>
  <text x="110" y="140" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" fill="#526277">HiNet、GitHub 與 Vercel 的分工及資料流向</text>
  <rect x="1550" y="72" width="250" height="54" rx="27" fill="#ffffff" stroke="#cfdae8" stroke-width="2"/>
  <text x="1675" y="107" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" font-weight="700" fill="#153a6b">正式網站架構</text>

  <!-- GitHub -->
  <g filter="url(#shadow)">
    <rect x="110" y="220" width="650" height="330" rx="20" fill="#ffffff"/>
  </g>
  <rect x="110" y="220" width="12" height="330" rx="6" fill="#24292f"/>
  <circle cx="195" cy="302" r="48" fill="#24292f"/>
  <path d="M175 300a20 20 0 1 1 40 0c0 9-6 16-14 19v15h-12v-15c-8-3-14-10-14-19zm20-9a9 9 0 1 0 0 18 9 9 0 0 0 0-18z" fill="#ffffff"/>
  <text x="270" y="294" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="700" fill="#142033">GitHub</text>
  <text x="270" y="330" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" fill="#667085">程式碼與版本管理中心</text>
  <line x1="165" y1="375" x2="705" y2="375" stroke="#e1e7ef" stroke-width="2"/>
  <circle cx="177" cy="419" r="7" fill="#2f6fb0"/>
  <text x="202" y="428" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" fill="#344054">保存網站程式、圖片與文件</text>
  <circle cx="177" cy="467" r="7" fill="#2f6fb0"/>
  <text x="202" y="476" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" fill="#344054"><tspan font-weight="700">demo</tspan>＝上線前審查版；<tspan font-weight="700">main</tspan>＝正式版</text>
  <circle cx="177" cy="515" r="7" fill="#2f6fb0"/>
  <text x="202" y="524" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" fill="#344054">推送版本後通知 Vercel 部署</text>

  <!-- HiNet -->
  <g filter="url(#shadow)">
    <rect x="1160" y="220" width="650" height="330" rx="20" fill="#ffffff"/>
  </g>
  <rect x="1798" y="220" width="12" height="330" rx="6" fill="#178760"/>
  <circle cx="1245" cy="302" r="48" fill="#e8f7f0"/>
  <circle cx="1245" cy="302" r="27" fill="none" stroke="#178760" stroke-width="5"/>
  <path d="M1218 302h54M1245 275c-12 14-12 40 0 54M1245 275c12 14 12 40 0 54" fill="none" stroke="#178760" stroke-width="4" stroke-linecap="round"/>
  <text x="1320" y="294" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="36" font-weight="700" fill="#142033">HiNet DNS</text>
  <text x="1320" y="330" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" fill="#667085">網域名稱與 DNS 指向管理</text>
  <line x1="1215" y1="375" x2="1755" y2="375" stroke="#e1e7ef" stroke-width="2"/>
  <circle cx="1227" cy="419" r="7" fill="#178760"/>
  <text x="1252" y="428" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" fill="#344054">管理 <tspan font-weight="700">ctdf.org.tw</tspan> 的 DNS 紀錄</text>
  <circle cx="1227" cy="467" r="7" fill="#178760"/>
  <text x="1252" y="476" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" fill="#344054">根網域 A 紀錄指向 Vercel</text>
  <circle cx="1227" cy="515" r="7" fill="#178760"/>
  <text x="1252" y="524" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="24" fill="#344054">www CNAME 紀錄指向 Vercel</text>

  <!-- Connectors -->
  <path d="M635 550 C700 620 735 640 790 674" fill="none" stroke="#2f6fb0" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <rect x="484" y="592" width="330" height="52" rx="26" fill="#eaf3ff"/>
  <text x="649" y="626" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="700" fill="#245c96">提交程式碼 → 自動部署</text>

  <path d="M1285 550 C1220 620 1185 640 1130 674" fill="none" stroke="#178760" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="1105" y="592" width="330" height="52" rx="26" fill="#e8f7f0"/>
  <text x="1270" y="626" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="700" fill="#126b4b">DNS 指向 → 網域生效</text>

  <!-- Vercel -->
  <g filter="url(#shadow)">
    <rect x="640" y="680" width="640" height="270" rx="20" fill="#ffffff"/>
  </g>
  <rect x="640" y="680" width="640" height="11" rx="5" fill="#142033"/>
  <path d="M738 790 L780 720 L822 790 Z" fill="#142033"/>
  <text x="865" y="758" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="38" font-weight="700" fill="#142033">Vercel</text>
  <text x="865" y="795" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="22" fill="#667085">自動建置、部署與網站代管</text>
  <line x1="700" y1="830" x2="1220" y2="830" stroke="#e1e7ef" stroke-width="2"/>
  <rect x="700" y="858" width="240" height="54" rx="12" fill="#fff1f2"/>
  <text x="820" y="891" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="700" fill="#b4232d">Demo：審查版</text>
  <rect x="960" y="858" width="260" height="54" rx="12" fill="#eaf3ff"/>
  <text x="1090" y="891" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="21" font-weight="700" fill="#245c96">Production：正式版</text>

  <!-- Visitor result -->
  <path d="M960 950 L960 994" fill="none" stroke="#d83a45" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <rect x="490" y="1000" width="940" height="60" rx="30" fill="#153a6b"/>
  <text x="960" y="1039" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="25" font-weight="700" fill="#ffffff">訪客輸入 www.ctdf.org.tw → HiNet 解析網域 → Vercel 回傳網站內容</text>
</svg>
